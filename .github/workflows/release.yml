name: release

on:
  push:
    tags: ['v*']

jobs:
  build-project:
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read

  upload:
    needs: build-project
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: collect the packages
        run: |
          v=${TAG#v}
          grep -q "\"version\": \"$v\"" buildspec.json || { echo "buildspec.json isnt $v"; exit 1; }
          mkdir out
          find artifacts -path '*dSYMs*' -prune -o -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.pkg' -o -name '*.deb' -o -name '*.ddeb' -o -name '*.tar.xz' \) -print -exec mv {} out/ \;
          ls -l out
          test -n "$(ls out/*windows-x64* 2>/dev/null)" || { echo "nothing for windows"; exit 1; }
          test -n "$(ls out/*windows-x64-installer.exe 2>/dev/null)" || { echo "no windows installer"; exit 1; }
          test -n "$(ls out/*macos-universal*.pkg 2>/dev/null)" || { echo "no mac pkg"; exit 1; }
          test -n "$(ls out/*.deb 2>/dev/null)" || { echo "no deb"; exit 1; }
          (cd out && sha256sum * > SHA256SUMS.txt)
      - name: upload
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "goome ${TAG#v}" --notes "goome ${TAG#v}"
          gh release upload "$TAG" out/* --clobber
