name: pr rules

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check:
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'MEMBER'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          COUNT: ${{ github.event.pull_request.changed_files }}
        run: |
          why=""
          if [ "$BASE" != "dev" ]; then
            why="PRs go to the dev branch, this one is against $BASE."
          fi
          if [ "$COUNT" -gt 3000 ]; then
            why="$why It changes more than 3000 files, thats way too big to check."
          fi
          files=$(gh api "repos/$REPO/pulls/$PR/files?per_page=100" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          if printf '%s\n' "$files" | grep -q '^\.github/'; then
            why="$why It changes something in .github/, thats CI and these rules so only I change those."
          fi
          if printf '%s\n' "$files" | grep -q '^native/'; then
            why="$why It changes something in native/, goome.h in there is copied from c-goome by tools/update_native.sh. Fix the C side in c-goome instead."
          fi
          if printf '%s\n' "$files" | grep -qxE 'CMakeLists\.txt|CMakePresets\.json|buildspec\.json|cmake/.*|tools/.*|src/plugin-support\..*'; then
            why="$why It changes the build (CMakeLists.txt, CMakePresets.json, buildspec.json, cmake/ or tools/), that builds the plugin people install into OBS so only I touch it."
          fi
          if printf '%s\n' "$files" | grep -qxE 'LICENSE|docs/.*\.png'; then
            why="$why It changes the LICENSE or the screenshots in docs/, only I change those."
          fi
          if [ -z "$why" ]; then
            echo "follows the rules"
            exit 0
          fi
          gh api "repos/$REPO/labels" -f name=rules-closed -f color=b60205 -f description="closed by the pr rules" >/dev/null 2>&1 || true
          gh api "repos/$REPO/issues/$PR/comments" -f body="Closed automatically, sorry. $why Check [CONTRIBUTING.md](https://github.com/goome-ui/obs-goome/blob/dev/CONTRIBUTING.md), fix it and open a new PR against dev." >/dev/null
          gh api "repos/$REPO/issues/$PR/labels" -f "labels[]=rules-closed" >/dev/null
          gh api -X PATCH "repos/$REPO/pulls/$PR" -f state=closed >/dev/null
          echo "closed: $why"
